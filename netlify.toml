# Netlify builds the site from GitHub on every commit, including every save
# Gaz makes in /admin. A failed build leaves the live site as it was.
[build]
  command = "npm run build"
  publish = "site"

[build.environment]
  NODE_VERSION = "22"

# The editor is never a search result.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
