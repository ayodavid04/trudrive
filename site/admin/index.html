<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>TruDrive: edit your website</title>
<link rel="icon" type="image/png" href="/img/favicon.png">
</head>
<body>
<!-- Sveltia CMS 0.230.1, kept in this folder rather than loaded from a CDN, so
     the editor works as long as his own site does and never changes under him
     unchecked. To update: `npm pack @sveltia/cms@<version>`, copy
     dist/sveltia-cms.js and dist/chunks/ here, try /admin, rerun the guide
     screenshots, then publish. -->
<script src="/admin/sveltia-cms.js"></script>
<script>
  // Fewer wrong turns for Gaz: hide the access-token sign-in and the
  // developer items in the editor's menu (Slug, Validation, Backlinks,
  // Restore Default, Clear All). Duplicate, Delete and Revert stay. If
  // Sveltia ever renames one, it simply shows again; nothing breaks.
  var HIDE = /^(Slug|Validation|Backlinks|Restore Default|Clear All)$/;
  new MutationObserver(function () {
    document.querySelectorAll('button').forEach(function (b) {
      if (/Access Token/i.test(b.textContent)) b.style.display = 'none';
    });
    document.querySelectorAll('[role^="menuitem"]').forEach(function (m) {
      if (HIDE.test(m.textContent.trim())) m.style.display = 'none';
    });
  }).observe(document.documentElement, { childList: true, subtree: true });
</script>
</body>
</html>
