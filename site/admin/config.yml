# Gaz's editor, at /admin. Sveltia CMS: https://sveltiacms.app/en/docs
#
# Every save is a commit to his GitHub repo. Cloudflare Pages sees the commit,
# runs npm run build, and the site is live about a minute later. A build that
# fails never replaces the live site, and the build skips anything it cannot
# read rather than failing, so a bad save cannot take the site down or block
# the next one.
#
# Login: "Sign in with GitHub", through Sveltia's authenticator running as a
# free Cloudflare Worker in his own Cloudflare account
# (https://github.com/sveltia/sveltia-cms-auth). base_url below is that
# Worker's address. Nothing for Gaz to run or renew.
#
# Dummy-proofing: required fields stop a job saving without both photos;
# character limits keep titles from wrecking the layout; the phone number is
# checked before it saves. Optional fields are last so he can ignore them.

backend:
  name: github
  repo: ayodavid04/trudrive
  branch: main
  base_url: https://sveltia-cms-auth.CHANGE-ME.workers.dev # his auth Worker, set at handover
  commit_messages:
    create: "Added {{collection}}: {{slug}}"
    update: "Changed {{collection}}: {{slug}}"
    delete: "Removed {{collection}}: {{slug}}"
    uploadMedia: "Uploaded {{path}}"
    deleteMedia: "Deleted {{path}}"

locale: en
app_title: TruDrive website
logo:
  src: /img/emblem.png

# Phone photos are 4 to 8 MB. They are shrunk to WebP in his browser before
# they upload, so the repo stays small and uploads are quick on 4G.
# scripts/content.mjs makes the sizes the pages use from these.
media_folder: site/uploads
public_folder: /uploads
media_libraries:
  all:
    transformations:
      raster_image:
        format: webp
        quality: 90
        width: 2400
        height: 2400
  default:
    config:
      # "IMG 4821.JPG" is saved as img-4821.webp: no spaces or capitals in web addresses.
      slugify_filename: true
      # 25 MB. Only a video can get near it (about 30 seconds from an iPhone);
      # bigger uploads to GitHub can fail, so the editor stops them first.
      max_file_size: 26214400

collections:
  - name: jobs
    label: Before and afters
    label_singular: Before and after
    description: Jobs with a before and an after photo, newest first. Press Save and it is on your website in about a minute.
    icon: compare
    folder: content/jobs
    format: json
    extension: json
    create: true
    delete: true
    slug: "{{fields.date}}-{{slug}}"
    identifier_field: title
    summary: "{{title}}"
    sortable_fields:
      fields: [date, title]
      default:
        field: date
        direction: descending
    fields:
      - name: title
        label: What was the job?
        hint: Short, like "Block paved drive" or "Decking to porcelain".
        widget: string
        maxlength: 50
      - name: before
        label: Before photo
        widget: image
      - name: after
        label: After photo
        hint: From the same spot as the before, if you can.
        widget: image
      - name: date
        label: Date finished
        hint: Newest jobs show first.
        widget: datetime
        time_format: false
        format: YYYY-MM-DD
        default: "{{now}}"
      - name: kind
        label: Type of job
        widget: select
        options: [Driveway, Back garden, Front garden, Patio, Path and steps, Fencing, Turf]
        default: Back garden
      - name: home
        label: Put it on the home page
        hint: The newest one switched on goes at the top of the home page.
        widget: boolean
        required: false
        default: false
      - name: town
        label: Town (optional)
        hint: Shows as "Back garden in Wigan".
        widget: string
        required: false
        maxlength: 30
      - name: about
        label: A line or two about it (optional)
        hint: What it was like before and what you did.
        widget: text
        required: false
        maxlength: 300
      - name: work
        label: What went in (optional)
        label_singular: item
        hint: Tap Add item for each one, like "Grey porcelain patio".
        widget: list
        required: false
      - name: crop
        label: If the photos get cropped, keep
        hint: On phones the photo is trimmed to fit. Leave it unless something important gets cut off.
        widget: select
        options:
          - { label: Lower down (the ground), value: low }
          - { label: The middle, value: middle }
          - { label: The top, value: top }
        default: low
      - name: before_alt
        label: Describe the before photo (optional)
        hint: Read out to blind visitors and helps Google. Like "Cracked concrete slabs full of weeds".
        widget: string
        required: false
        maxlength: 150
      - name: after_alt
        label: Describe the after photo (optional)
        hint: Like "A grey porcelain patio with black edging".
        widget: string
        required: false
        maxlength: 150

  - name: photos
    label: Finished photos
    label_singular: Finished photo
    description: Single photos of finished jobs, newest first. Press Save and it is on your website in about a minute.
    icon: photo_library
    folder: content/photos
    format: json
    extension: json
    create: true
    delete: true
    slug: "{{fields.date}}-{{slug}}"
    identifier_field: title
    summary: "{{title}}"
    sortable_fields:
      fields: [date, title]
      default:
        field: date
        direction: descending
    fields:
      - name: photo
        label: Photo
        widget: image
      - name: title
        label: What is it?
        hint: Short, like "Block paved driveway".
        widget: string
        maxlength: 50
      - name: kind
        label: Type of job
        hint: Sorts it under Driveways, Patios and gardens or Fencing on Our work.
        widget: select
        options: [Driveway, Back garden, Front garden, Patio, Path and steps, Fencing, Turf]
        default: Patio
      - name: date
        label: Date
        hint: Newest show first.
        widget: datetime
        time_format: false
        format: YYYY-MM-DD
        default: "{{now}}"
      - name: line
        label: One line under it (optional)
        hint: Like "Grey block with a charcoal border".
        widget: string
        required: false
        maxlength: 80
      - name: crop
        label: If the photo gets cropped, keep
        hint: Leave it unless something important gets cut off.
        widget: select
        options:
          - { label: Lower down (the ground), value: low }
          - { label: The middle, value: middle }
          - { label: The top, value: top }
        default: low
      - name: alt
        label: Describe the photo (optional)
        hint: Read out to blind visitors and helps Google.
        widget: string
        required: false
        maxlength: 150

  - name: videos
    label: Videos
    label_singular: Video
    description: Videos of your jobs, newest first. Pick one from your phone and press Save. Videos take a few minutes longer than photos to show on your website.
    icon: videocam
    folder: content/videos
    format: json
    extension: json
    create: true
    delete: true
    slug: "{{fields.date}}-{{slug}}"
    identifier_field: title
    summary: "{{title}}"
    sortable_fields:
      fields: [date, title]
      default:
        field: date
        direction: descending
    fields:
      - name: video
        label: Video
        hint: Pick it from your phone. Up to 25 MB, about 30 seconds. Too big? Leave this empty and paste the TikTok link below instead.
        widget: file
        accept: video/*
        required: false
        # Kept out of the website folder: the build makes the web copy from it.
        media_folder: /content/videos/files
        public_folder: /content/videos/files
      - name: tiktok
        label: Or a TikTok link
        hint: On TikTok, tap Share, then Copy link, and paste it here.
        widget: string
        required: false
        pattern: ['^https://([a-z]+\.)?tiktok\.com/\S+$', 'A TikTok link, starting https://www.tiktok.com or https://vm.tiktok.com']
      - name: title
        label: What is it?
        hint: Short, like "Laying a porcelain patio".
        widget: string
        maxlength: 50
      - name: kind
        label: Type of job
        hint: Sorts it under Driveways, Patios and gardens or Fencing on Our work.
        widget: select
        options: [Driveway, Back garden, Front garden, Patio, Path and steps, Fencing, Turf]
        default: Patio
      - name: date
        label: Date
        hint: Newest show first.
        widget: datetime
        time_format: false
        format: YYYY-MM-DD
        default: "{{now}}"
      - name: home
        label: Put it on the home page
        hint: Up to four show on the home page. The ones switched on go first, then the newest.
        widget: boolean
        required: false
        default: false
      - name: line
        label: One line under it (optional)
        hint: Like "Grey porcelain, black edging".
        widget: string
        required: false
        maxlength: 80
      - name: poster
        label: Cover photo (optional)
        hint: What shows before it plays. Leave it and a picture from the start of the video is used.
        widget: image
        required: false

  - name: reviews
    label: Reviews
    label_singular: Review
    description: Copy a customer's Google review onto your website, word for word. Press Save and it is on your website in about a minute.
    icon: star
    folder: content/reviews
    format: json
    extension: json
    create: true
    delete: true
    slug: "{{fields.date}}-{{slug}}"
    identifier_field: name
    summary: "{{name}}"
    sortable_fields:
      fields: [date, name]
      default:
        field: date
        direction: descending
    fields:
      - name: name
        label: Customer's name
        hint: As it shows on Google, like "Sarah T".
        widget: string
        maxlength: 40
      - name: text
        label: What they wrote
        hint: Word for word from Google. Don't change or add anything. It has to be their words.
        widget: text
        maxlength: 700
      - name: stars
        label: Stars
        widget: select
        options:
          - { label: 5 stars, value: 5 }
          - { label: 4 stars, value: 4 }
          - { label: 3 stars, value: 3 }
        default: 5
      - name: date
        label: Date of the review
        widget: datetime
        time_format: false
        format: YYYY-MM-DD
        default: "{{now}}"

  # Business details are files, not lists: they can be changed but never
  # deleted, so a footer or the legal address can never go missing.
  - name: settings
    label: Business details
    icon: call
    files:
      - name: business
        label: Phone, towns, address and hours
        file: content/business.json
        format: json
        fields:
          - name: phone
            label: Phone number
            hint: Shown on every page, and the WhatsApp buttons use it, so WhatsApp must be on this number.
            widget: string
            pattern: ['^0\d{3,4} ?\d{3} ?\d{3,4}$', 'A UK number starting with 0, like 07923 485811']
          - name: areas
            label: Towns you cover
            label_singular: town
            hint: Tap Add town for each one, like Wigan. They show in the footer and on the contact page, and tell Google where you work.
            widget: list
            required: false
          - name: hours
            label: When you take calls (optional)
            hint: Like "Mon to Sat, 8am to 6pm".
            widget: string
            required: false
            maxlength: 60
          - name: street
            label: Business address, first line
            hint: The law says your business address must be on your website. A registered office address is fine if you don't want your home shown.
            widget: string
            required: false
            maxlength: 80
          - name: town
            label: Business address, town
            hint: Until the full address is in, the website says "Based in" this town.
            widget: string
            required: false
            maxlength: 40
          - name: postcode
            label: Business address, postcode
            widget: string
            required: false
            pattern: ['^[A-Za-z]{1,2}\d[A-Za-z\d]? ?\d[A-Za-z]{2}$', 'A UK postcode, like WN1 1AA']
          - name: facebook
            label: Your Facebook page (optional)
            hint: Open your page on Facebook and copy the link from the address bar. It goes in the footer and tells Google the page is yours.
            widget: string
            type: url
            required: false
      - name: google
        label: Google reviews links
        file: content/google.json
        format: json
        fields:
          - name: review_link
            label: Your "leave a review" link
            hint: In your Google Business Profile, tap "Ask for reviews" and copy the link. It puts a Leave a review button on your website, and your review QR code takes customers to it.
            widget: string
            type: url
            required: false
          - name: profile_link
            label: Your business on Google Maps
            hint: Open your business on Google Maps, tap Share and copy the link. It puts a See our reviews on Google button on your website.
            widget: string
            type: url
            required: false
      - name: about
        label: About you
        file: content/about.json
        format: json
        fields:
          - name: text
            label: A few lines about you
            hint: In your own words. How you started, what you care about on a job. Leave a blank line between paragraphs.
            widget: text
            required: false
            maxlength: 900
          - name: photo
            label: Photo of you, the team or the van (optional)
            widget: image
            required: false
