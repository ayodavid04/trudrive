<dialog class="quote" id="quote" aria-labelledby="quote-title">
  <div class="quote__in">
    <div class="quote__top">
      <div>
        <h2 id="quote-title">Get a free quote</h2>
        <p class="quote__lede">Tell us what you need. It opens WhatsApp with this filled in, so you can add a photo of the space and send it straight to Gaz.</p>
      </div>
      <button class="quote__x" type="button" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <form novalidate>
      <label>What needs doing
        <select name="job" required>
          <option value="">Choose one</option>
          <option>New driveway</option>
          <option>Patio</option>
          <option>Full garden makeover</option>
          <option>Paths or steps</option>
          <option>Fencing</option>
          <option>Turf or artificial grass</option>
          <option>Walls or brickwork</option>
          <option>Something else</option>
        </select>
      </label>
      <label>Your town or postcode <span class="opt">(optional)</span>
        <input name="where" autocomplete="postal-code" inputmode="text">
      </label>
      <label>Your name <span class="opt">(optional)</span>
        <input name="name" autocomplete="name">
      </label>
      <label>Anything else <span class="opt">(optional)</span>
        <textarea name="notes" rows="3" placeholder="Rough size, what's there now, when you're hoping for"></textarea>
      </label>
      <p data-status role="status" aria-live="polite"></p>
      <button class="quote__send" type="submit">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.1 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2c.2-.6.2-1.1.1-1.2l-.5-.3z"/></svg>
        Send on WhatsApp
      </button>
      <p class="quote__or">Rather talk? Ring Gaz on <a href="tel:+447923485811">07923 485811</a>.</p>
    </form>
  </div>
</dialog>
