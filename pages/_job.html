<!doctype html>
<html lang="en-GB">
<head>
<x-head title="{{jobHeading}} | Before and After | TruDrive" desc="{{jobDesc}}" path="our-work/{{jobSlug}}/" image="{{jobImage}}" image-w="{{jobImageW}}" image-h="{{jobImageH}}"></x-head>
<link rel="stylesheet" href="{{root}}assets/parts.css">
<link rel="stylesheet" href="{{root}}assets/clean.css">
<x-page-ld name="{{jobTitle}}" path="our-work/{{jobSlug}}/" parent="our-work/" parent-name="Our work"></x-page-ld>
</head>
<body>
<x-include file="_header.html" active="work"></x-include>

<main id="main">
  <section class="page-head">
    <div class="wrap">
      <p class="kicker">{{jobKicker}}</p>
      <h1>{{jobHeading}}</h1>
      {{jobAbout}}
    </div>
  </section>

  <section class="sec" aria-labelledby="in-t">
    <div class="wrap split split--wide-img">
      {{jobBa}}
      <div class="split__txt">
        <h2 id="in-t">What went in</h2>
        {{jobTicks}}
        <div class="hero__btns">
          <a class="btn" href="{{root}}contact/" data-quote>Get a free quote</a>
          <a class="btn btn--ghost" href="https://wa.me/{{wa}}">Send photos on WhatsApp</a>
        </div>
        <div class="job-links">{{jobLinks}}</div>
      </div>
    </div>
  </section>

  <section class="sec sec--paper" aria-labelledby="more-t">
    <div class="wrap">
      <div class="sec__head sec__head--row">
        <h2 id="more-t">More of our work</h2>
        <a class="link" href="{{root}}our-work/">All our work <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      </div>
      <div class="towns">{{otherJobs}}</div>
    </div>
  </section>
</main>

<x-include file="_footer.html"></x-include>
</body>
</html>
